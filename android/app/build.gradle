// Aplikasi Android kasir Batang Garing (tanpa Chrome).
// Kasir web dibawa di dalam APK dan ditampilkan di WebView milik aplikasi sendiri (alamatnya tetap
// alamat GitHub Pages agar data tersimpan tetap sama); printer Bluetooth lewat NativeBridge.java.
plugins {
    id 'com.android.application'
}

def siteUrl = 'https://tengkuilhamsyahti-lgtm.github.io/kasir-batang-garing/'

android {
    namespace 'id.batanggaring.kasir'
    compileSdk 34

    defaultConfig {
        applicationId 'id.batanggaring.kasir'
        minSdk 21
        targetSdk 34
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName '1.' + (System.getenv('VERSION_CODE') ?: '0')
        resValue 'string', 'site_url', siteUrl
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('KS_PATH') ?: 'release.jks')
            storePassword System.getenv('KS_PASS')
            keyAlias 'kasir'
            keyPassword System.getenv('KS_PASS')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
    }

    sourceSets {
        main.assets.srcDirs += "$buildDir/generated/web"
    }
}

// salin file kasir web dari akar repo ke dalam APK (assets/www) supaya jalan tanpa internet
def copyWeb = tasks.register('copyWeb', Copy) {
    from(rootProject.file('..')) {
        include 'index.html', 'manifest.json', 'icon.svg', 'logo-192.png', 'logo-512.png', 'icon-maskable-512.png'
    }
    into "$buildDir/generated/web/www"
}
tasks.named('preBuild') { dependsOn copyWeb }
