// Aplikasi Android kasir Batang Garing (tanpa Chrome).
// Membuka kasir web GitHub Pages di WebView milik aplikasi sendiri, jadi pembaruan web
// langsung ikut; printer Bluetooth lewat jembatan native (NativeBridge.java).
plugins {
    id 'com.android.application'
}

def siteUrl = 'https://tengkuilhamsyahti-lgtm.github.io/kasir-batang-garing/'

android {
    namespace 'id.batanggaring.kasir'
    compileSdk 34

    defaultConfig {
        applicationId 'id.batanggaring.kasir'
        minSdk 21
        targetSdk 34
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName '1.' + (System.getenv('VERSION_CODE') ?: '0')
        resValue 'string', 'site_url', siteUrl
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('KS_PATH') ?: 'release.jks')
            storePassword System.getenv('KS_PASS')
            keyAlias 'kasir'
            keyPassword System.getenv('KS_PASS')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
    }
}
