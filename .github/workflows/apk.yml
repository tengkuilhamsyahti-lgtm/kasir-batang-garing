# Membangun APK Android (WebView sendiri, tanpa Chrome) dari folder android/
# lalu menerbitkannya di halaman Releases agar bisa diunduh dari tablet.
# Di pull request APK hanya dibangun untuk diperiksa, tidak diterbitkan.
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml', 'index.html', 'manifest.json', 'icon.svg', 'logo-*.png', 'icon-maskable-512.png']
  pull_request:
    paths: ['android/**', '.github/workflows/apk.yml', 'index.html', 'manifest.json', 'icon.svg', 'logo-*.png', 'icon-maskable-512.png']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Siapkan kunci tanda tangan
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KS_PASS=$KS_PASS_SECRET" >> "$GITHUB_ENV"
            echo "Kunci tanda tangan: TETAP (dari secret KEYSTORE_BASE64)"
          else
            echo "::warning::Secret KEYSTORE_BASE64 belum ada, memakai kunci acak (bar URL akan muncul)"
            P=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias kasir -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$P" -keypass "$P" -dname "CN=Batang Garing Coffee, O=Batang Garing, C=ID"
            echo "::add-mask::$P"
            echo "KS_PASS=$P" >> "$GITHUB_ENV"
          fi
          echo "KS_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          # nomor versi harus selalu naik supaya APK baru bisa dipasang di atas yang lama
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Siapkan file
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk KasirBatangGaring.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "$BT"apksigner verify --print-certs KasirBatangGaring.apk | tee sertifikat.txt
          grep -qi "SHA-256 digest: cdf5dc7b3c9d5df041a06f40ac01a0f8192aed836b1ce40c9b54c823096f1f2e" sertifikat.txt \
            && echo "Kunci sama dengan APK sebelumnya (bisa dipasang di atasnya)" \
            || echo "::warning::Kunci APK berbeda dari APK sebelumnya: tablet harus menghapus aplikasi lama dulu"

      - uses: actions/upload-artifact@v4
        with:
          name: KasirBatangGaring-apk
          path: |
            KasirBatangGaring.apk
            sertifikat.txt

      - uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: apk-${{ github.run_number }}
          name: Kasir Batang Garing APK ${{ github.run_number }}
          body: |
            Unduh **KasirBatangGaring.apk** di bawah ini dari tablet Android, lalu buka file-nya untuk memasang.
            Aplikasi berjalan sendiri tanpa Chrome dan tanpa internet (tampilan kasir ada di dalam APK), menyambung ke printer Bluetooth langsung, dan mencadangkan data otomatis setiap hari ke folder Download/BatangGaring.
            Pasang di atas versi lama, data tetap ada.
            Pindah dari APK lama (versi Chrome)? Sebelum memasang, buka aplikasi lama lalu Atur → Data → Simpan cadangan lengkap. Setelah APK ini terpasang, di layar Buat akun pemilik ketuk "Pulihkan dari file cadangan".
          files: KasirBatangGaring.apk
          make_latest: true
