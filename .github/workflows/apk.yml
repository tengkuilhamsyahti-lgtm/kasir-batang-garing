# Membangun APK Android (Trusted Web Activity) dari folder android/
# lalu menerbitkannya di halaman Releases agar bisa diunduh dari tablet.
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Siapkan kunci tanda tangan
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KS_PASS=$KS_PASS_SECRET" >> "$GITHUB_ENV"
          else
            P=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias kasir -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$P" -keypass "$P" -dname "CN=Batang Garing Coffee, O=Batang Garing, C=ID"
            echo "::add-mask::$P"
            echo "KS_PASS=$P" >> "$GITHUB_ENV"
          fi
          echo "KS_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Siapkan file
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk KasirBatangGaring.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "$BT"apksigner verify --print-certs KasirBatangGaring.apk | tee sertifikat.txt

      - uses: actions/upload-artifact@v4
        with:
          name: KasirBatangGaring-apk
          path: |
            KasirBatangGaring.apk
            sertifikat.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Kasir Batang Garing APK ${{ github.run_number }}
          body: |
            Unduh **KasirBatangGaring.apk** di bawah ini dari tablet Android, lalu buka file-nya untuk memasang.
            Aplikasi membuka kasir web Batang Garing di Chrome, jadi pembaruan aplikasi web langsung ikut tanpa memasang ulang APK.
          files: KasirBatangGaring.apk
          make_latest: true
